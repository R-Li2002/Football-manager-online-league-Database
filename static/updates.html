<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更新记录 - HEIGO</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/static/app.css">
    <link rel="stylesheet" href="/static/css/ui-foundation.css">
    <link rel="stylesheet" href="/static/subpages.css">
</head>
<body class="light-mode">
    <div class="container subpage-container subpage-shell-updates">
        <header class="shell-header">
            <div class="shell-topbar glass-card subpage-topbar">
                <a class="btn btn-secondary shell-button subpage-nav-button" href="/">返回主站</a>
                <button class="btn btn-secondary shell-button theme-toggle" type="button" onclick="toggleTheme()">
                    <span id="themeIcon" class="subpage-theme-icon" aria-hidden="true"><svg class="ui-icon is-small" viewBox="0 0 24 24" focusable="false"><path class="theme-moon-path" d="M20 15.3A8.2 8.2 0 0 1 8.7 4a8.4 8.4 0 1 0 11.3 11.3Z"/><g class="theme-sun-path"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></g></svg></span>
                    <span id="themeText">切换夜间</span>
                </button>
            </div>
        </header>

        <main id="updatesTimeline" class="surface-card updates-timeline">
            <div class="loading">加载中...</div>
        </main>
    </div>

    <script src="/static/js/subpage.theme.js"></script>
    <script src="/static/js/updates.page.js"></script>
</body>
</html>
